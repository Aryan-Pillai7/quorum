[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quorum"
version = "0.1.0"
description = "AI-augmented three-way payment reconciliation engine"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    # Phase 3 agent layer (ADR-0016). google-genai, not google-generativeai: the latter
    # is end-of-life and prints a deprecation notice on import.
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a live Postgres, so they are opt-in:
#   pytest -m integration
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: requires a running Postgres (see README)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `x: T = Depends(...)` in the signature.
# B008 exists to catch mutable default arguments; this is neither mutable nor a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
