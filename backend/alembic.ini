[alembic]
script_location = alembic
prepend_sys_path = .
# Explicit separator; without it Alembic falls back to legacy splitting and warns.
path_separator = os
# sqlalchemy.url is deliberately absent: the URL comes from app settings in
# alembic/env.py so there is exactly one source of truth for it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
